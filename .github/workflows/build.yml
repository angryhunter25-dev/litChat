name: Build Litchat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | head -n 1)")
          
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Litchat APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

