name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip project
        run: unzip -o project.zip -d src

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (with retry)
        working-directory: src
        run: |
          for i in 1 2 3; do
            gradle assembleDebug --no-daemon --refresh-dependencies && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

      - name: Rename APK
        working-directory: src
        run: cp app/build/outputs/apk/debug/app-debug.apk LitChat.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LitChat build ${{ github.run_number }}
          files: src/LitChat.apk
