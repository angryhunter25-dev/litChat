name: Build Litchat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Litchat Debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk Litchat.apk

      - name: Upload Litchat APK
        uses: actions/upload-artifact@v4
        with:
          name: Litchat-APK
          path: Litchat.apk
          if-no-files-found: error
